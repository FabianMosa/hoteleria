name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    # Solo ejecuta el deploy si las pruebas pasaron Y es un push a la rama principal (main)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Sanitize Docker Username
        id: prep
        run: |
          # Extrae el secreto de usuario y elimina comillas, espacios y dominios de email
          RAW_USER="${{ secrets.DOCKER_USERNAME }}"
          CLEAN_USER=$(echo "$RAW_USER" | sed "s/[[:space:]\"\']//g" | tr '[:upper:]' '[:lower:]' | cut -d'@' -f1)
          
          # Valida que el nombre de usuario no esté vacío
          if [ -z "$CLEAN_USER" ]; then
            echo "::error::El secreto DOCKER_USERNAME está vacío o no está configurado en GitHub Secrets."
            exit 1
          fi
          
          # Exporta la variable sanitizada para ser usada en los siguientes pasos
          echo "username=${CLEAN_USER}" >> $GITHUB_OUTPUT

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true          # Sube la imagen compilada hacia el registro remoto de Docker Hub
          tags: ${{ steps.prep.outputs.username }}/hoteleria_web:v1
